services:
  postgres:
    image: postgres:18
    container_name: greyhaven-postgres
    environment:
      POSTGRES_DB: greyhaven
      POSTGRES_USER: greyhaven
      POSTGRES_PASSWORD: greyhaven
    ports:
      - "5434:5432"
    volumes:
      - greyhaven_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greyhaven -d greyhaven"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  greyhaven_pg_data:
