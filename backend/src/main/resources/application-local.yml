spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/greyhaven
    username: greyhaven
    password: greyhaven
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false

server:
  servlet:
    session:
      cookie:
        secure: false

logging:
  level:
    org.hibernate.SQL: WARN

greyhaven:
  diagnostics:
    enabled: true
