# Phase 2 character progression, combat-derived stats, and out-of-combat recovery.
character:
  startingLevel: 1
  startingExperience: 0
  startingStrength: 5
  startingAgility: 5
  startingEndurance: 5
  startingPerception: 5
  startingGold: 100
  maxLevel: 30
  baseMaxHealth: 100
  healthPerEndurance: 12
  healthPerLevel: 5
  baseMaxStamina: 50
  staminaPerEndurance: 4
  staminaPerAgility: 3
  defeatRecoveryPercent: 50

progression:
  attributePointsPerLevel: 2
  maxAttributeValue: 40
  freeRespecMaxLevel: 10
  respecBaseGold: 500
  respecGoldPerLevel: 100
  # Index 0 unused. Index n is total XP required to reach level n.
  cumulativeXpToReachLevel:
    [0, 0, 100, 280, 560, 960, 1510, 2230, 3130, 4230, 5580,
     7230, 9230, 11630, 14480, 17830, 21730, 26230, 31430, 37430, 44330,
     52230, 61230, 71430, 82930, 95830, 110230, 126230, 143930, 163430, 184830]

combat:
  physicalDamagePerStrength: 1.5
  baseAccuracy: 75
  accuracyPerPerception: 1.5
  dodgePerAgility: 1.2
  baseCriticalChance: 5.0
  criticalChancePerPerception: 0.35
  minHitChance: 5
  maxHitChance: 95
  critChanceCap: 35
  criticalDamageMult: 2
  armorK: 50
  minDamageAfterArmor: 1
  armorBreakPerStack: 0.20
  guardedDamageTakenMult: 0.50
  bleedDamagePerStack: 4
  poisonDamagePerStack: 3
  bleedMaxStacks: 3
  poisonMaxStacks: 3
  armorBreakMaxStacks: 3
  stunImmunityRounds: 1
  offBalanceDodgePenalty: 15
  offBalanceAccuracyPenalty: 8
  counterDamagePercent: 20
  cleaveVsGuardedPercent: 15
  advancedDamagePercent: 25
  advancedHpThresholdPercent: 40
  staminaRegenPerRound: 4
  staminaRegenPerAgility: 0.2
  enemyStaminaRegenPerRound: 4
  defendStaminaRestore: 8
  enemyBasicStaminaCost: 8
  enemyHeavyStaminaCost: 18
  enemyStatusAttackStaminaCost: 12

recovery:
  bands:
    - maxLevel: 5
      healthPercentPerMinute: 20.0
      staminaPercentPerMinute: 40.0
    - maxLevel: 10
      healthPercentPerMinute: 15.0
      staminaPercentPerMinute: 30.0
    - maxLevel: 20
      healthPercentPerMinute: 10.0
      staminaPercentPerMinute: 20.0
    - maxLevel: 30
      healthPercentPerMinute: 7.5
      staminaPercentPerMinute: 15.0

mastery:
  maxLevel: 10
  xpPerVictory: 12
  # Technique unlocks (actives at 2/4/6/8, mastery passive at 10).
  unlockLevels: [2, 4, 6, 8, 10]
  # Index 0 unused. Index n is total mastery XP required to reach mastery level n.
  # 0→10 is slower than character 1→10 (5580 XP).
  cumulativeXpToReachLevel:
    [0, 80, 200, 400, 720, 1160, 1760, 2560, 3760, 5560, 15000]

inventory:
  defaultCapacity: 40

market:
  merchantBuyMultiplier: 0.55
  merchantSellMultiplier: 1.30
  affixValuePerAffix: 0.08
  maxMerchantPurchaseQuantity: 99
  listingFeePercent: 0.02
  saleFeePercent: 0.08
  listingPageSize: 20
  maxListingPageSize: 50
  # Catalog baseValue already scales with rarity. Merchant prices must not apply these again.
  rarityModifiers:
    COMMON: 1.0
    UNCOMMON: 1.15
    RARE: 1.35
    EPIC: 1.60

crafting:
  maxRank: 10
  xpPerRecipe: 15
  # Keep Common the modal crafted rarity at rank 10 on a Common–Epic band.
  rankRarityBonusPerRank: 1
  # Index 0 unused. Index n is total profession XP required to reach rank n.
  cumulativeXpToReachRank:
    [0, 0, 40, 90, 160, 250, 360, 500, 680, 900, 1200]
  salvageRarityMultipliers:
    COMMON: 1
    UNCOMMON: 1
    RARE: 2
    EPIC: 3

items:
  baseRollPercentMin: 95
  baseRollPercentMax: 105
  rarityWeights:
    COMMON: 60
    UNCOMMON: 25
    RARE: 12
    EPIC: 3
  affixCounts:
    COMMON: 0
    UNCOMMON: 1
    RARE: 2
    EPIC: 3
  armorDodge:
    LIGHT: 2
    MEDIUM: 0
    HEAVY: -3

pvp:
  startingRating: 1000
  ratingKFactor: 24
  ratingFloor: 0
  repeatWindowHours: 24
  repeatRatingMultiplier: 0.0
  marksPerWin: 8
  marksPerLoss: 2
  maxSnapshotPotions: 3
  maxArenaChallengesPerDay: 20
  opponentRatingBand: 400
  opponentsPageSize: 20
  historyPageSize: 20
  duelChallengeTtlMinutes: 10
  duelActionTimeoutMinutes: 10
  duelExpireMinutes: 30
  healWhenHpPercentBelowDefault: 40
  defendWhenStaminaPercentBelowDefault: 25
  finisherWhenEnemyHpPercentBelowDefault: 35

expedition:
  forestPatrolDurationMinutes: 20
  strategies:
    CAUTIOUS:
      injuryChancePercent: 10
      injuryDamageMin: 3
      injuryDamageMax: 8
      goldMin: 2
      goldMax: 12
      xpMin: 8
      xpMax: 18
      emptyHaulChancePercent: 20
      materialChancePercent: 35
      potionChancePercent: 20
      commonGearChancePercent: 8
      rareGearChancePercent: 4
      herbChancePercent: 25
    BALANCED:
      injuryChancePercent: 25
      injuryDamageMin: 5
      injuryDamageMax: 12
      goldMin: 5
      goldMax: 20
      xpMin: 15
      xpMax: 30
      emptyHaulChancePercent: 12
      materialChancePercent: 50
      potionChancePercent: 30
      commonGearChancePercent: 15
      rareGearChancePercent: 8
      herbChancePercent: 40
    AGGRESSIVE:
      injuryChancePercent: 45
      injuryDamageMin: 8
      injuryDamageMax: 18
      goldMin: 8
      goldMax: 35
      xpMin: 22
      xpMax: 45
      emptyHaulChancePercent: 8
      materialChancePercent: 65
      potionChancePercent: 40
      commonGearChancePercent: 22
      rareGearChancePercent: 12
      herbChancePercent: 50
