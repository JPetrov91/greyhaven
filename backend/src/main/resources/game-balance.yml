# Phase 2 character progression, combat-derived stats, and out-of-combat recovery.
character:
  startingLevel: 1
  startingExperience: 0
  startingStrength: 5
  startingAgility: 5
  startingEndurance: 5
  startingPerception: 5
  startingGold: 100
  maxLevel: 30
  baseMaxHealth: 100
  healthPerEndurance: 12
  healthPerLevel: 5
  baseMaxStamina: 50
  staminaPerEndurance: 4
  staminaPerAgility: 3
  defeatRecoveryPercent: 50

progression:
  attributePointsPerLevel: 2
  maxAttributeValue: 40
  freeRespecMaxLevel: 10
  respecBaseGold: 500
  respecGoldPerLevel: 100
  # Index 0 unused. Index n is total XP required to reach level n.
  cumulativeXpToReachLevel:
    [0, 0, 100, 280, 560, 960, 1510, 2230, 3130, 4230, 5580,
     7230, 9230, 11630, 14480, 17830, 21730, 26230, 31430, 37430, 44330,
     52230, 61230, 71430, 82930, 95830, 110230, 126230, 143930, 163430, 184830]

combat:
  physicalDamagePerStrength: 1.5
  baseAccuracy: 75
  accuracyPerPerception: 1.5
  dodgePerAgility: 1.2
  baseCriticalChance: 5.0
  criticalChancePerPerception: 0.35

recovery:
  bands:
    - maxLevel: 5
      healthPercentPerMinute: 20.0
      staminaPercentPerMinute: 40.0
    - maxLevel: 10
      healthPercentPerMinute: 15.0
      staminaPercentPerMinute: 30.0
    - maxLevel: 20
      healthPercentPerMinute: 10.0
      staminaPercentPerMinute: 20.0
    - maxLevel: 30
      healthPercentPerMinute: 7.5
      staminaPercentPerMinute: 15.0

mastery:
  maxLevel: 10
  xpPerVictory: 12
  # Technique unlocks (actives at 2/4/6/8, mastery passive at 10).
  unlockLevels: [2, 4, 6, 8, 10]
  # Index 0 unused. Index n is total mastery XP required to reach mastery level n.
  # 0→10 is slower than character 1→10 (5580 XP).
  cumulativeXpToReachLevel:
    [0, 80, 200, 400, 720, 1160, 1760, 2560, 3760, 5560, 15000]

inventory:
  defaultCapacity: 40

items:
  baseRollPercentMin: 95
  baseRollPercentMax: 105
  rarityWeights:
    COMMON: 60
    UNCOMMON: 25
    RARE: 12
    EPIC: 3
  affixCounts:
    COMMON: 0
    UNCOMMON: 1
    RARE: 2
    EPIC: 3
  armorDodge:
    LIGHT: 2
    MEDIUM: 0
    HEAVY: -3
